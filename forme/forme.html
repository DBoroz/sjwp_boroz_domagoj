<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Forme u HTML-u</h1>
    <form action="#" method="get">
      <label for="ime">Unesi ime:</label>
      <input type="text" id="ime" placeholder="Unesi ime..." disabled />
      <br />
      <label for="prezime">Prezime:</label>
      <input type="text" id="prezime" size="10" maxlength="4" />
      <br />
      <label for="pass">Unesi lozinku:</label>
      <input type="password" name="pass" id="pass" required />
      <br />
      <label for="mail">Mail:</label>
      <input type="email" name="mail" id="mail" />
      <br />
      <label for="datum">Izaberi datum:</label>
      <input type="date" name="datum" id="datum" />
      <br />
      <label for="boja">Izaberi boju: </label>
      <input type="color" name="boja" id="boja" />
      <br />
      <label for="file">Priloži datoteku</label>
      <input type="file" name="file" id="file" />
      <br />
      <label for="tel">Unesi broj mobitela:</label>
      <input type="tel" name="tel" id="tel" />
      <br />
      <p>Odaberi najbolji klub:</p>
      <input type="radio" name="klub" id="real" value="Real Madrid" />
      <label for="real">Real Madrid</label>
      <br />
      <input type="radio" name="klub" id="barca" />
      <label for="barca">Barcelona</label>
      <br />
      <p>Odaberi najbolji klub:</p>
      <input type="radio" name="klub" id="real" value="Real Madrid" />
      <label for="real">Real Madrid</label>
      <br />
      <input type="radio" name="klub" id="barca" />
      <label for="barca">Barcelona</label>
      <br />
      <p>Odaberi najbolji klub:</p>
      <input type="checkbox" name="klub" id="real" value="Real Madrid" />
      <label for="real">Real Madrid</label>
      <br />
      <input type="checkbox" name="klub" id="barca" />
      <label for="barca">Barcelona</label>
      <br />
      <input type="submit" value="Pošalji" />
      <input type="reset" value="Obriši" />
      <br />
    </form>
  </body>
</html>
