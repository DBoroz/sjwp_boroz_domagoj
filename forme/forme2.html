<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Student registration form</h1>
    <form action="#" method="get">
      <label for="roll">Roll No: </label>
      <input type="text" id="roll" />
      <br />
      <label for="ime">Student name:</label>
      <input type="text" id="ime" />
      <br />
      <label for="imeo">Father's name:</label>
      <input type="text" id="imeo" />
      <br />
      <label for="datum">Date of birth:</label>
      <input type="date" name="datum" id="datum" />
      <br />
      <label for="tel">Mobile No:</label>
      <input type="tel" name="tel" id="tel" />
      <br />
      <label for="mail">Email id:</label>
      <input type="email" name="mail" id="mail" />
      <br />
      <label for="pass">Password:</label>
      <input type="password" name="pass" id="pass" />
      <br />
      <label for="spol">Gender:</label>
      <input type="radio" name="spol" id="male" value="male" />
      <label for="male">Muško</label>
      <input type="radio" name="spol" id="female" value="female" />
      <label for="female">Žensko</label>
      <br />
      <label for="dep">Department:</label>
      <input type="checkbox" name="dep" id="cse" />
      <label for="cse">CSE</label>
      <input type="checkbox" name="dep" id="it" />
      <label for="it">IT</label>
      <input type="checkbox" name="dep" id="ece" />
      <label for="ece">ECE</label>
      <input type="checkbox" name="dep" id="civil" />
      <label for="civil">Civil</label>
      <input type="checkbox" name="dep" id="mech" />
      <label for="mech">Mech</label>
      <br />
      <label for="course">Course:</label>
      <select
        name="course"
        id="course"
        aria-placeholder="-----Select course:-----"
      ></select>
    </form>
  </body>
</html>
